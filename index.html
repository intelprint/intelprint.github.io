<!doctype html>
<!--
  intelprint public page (https://intelprint.github.io).
  Google shows a "created by an Apps Script user" banner on Apps Script web apps opened directly.
  Opened inside this page the banner does not appear, so the public hub and its apps are shown here:
  - #hub: the public intelprint web app (연구회 only), with ?embed=1.
  - When a tile is clicked, the hub sends {type: 'intelprint:open', url} and the app opens full screen on top.
    Only messages from inside #hub with an Apps Script web app link are accepted.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>intelprint</title>
    <meta name="description" content="만들고, 쓰고, 나누는 앱들" />
    <meta name="theme-color" content="#0e0d13" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23120f17'/%3E%3Cpath d='M9 12.5 12.5 8h7l3.5 4.5L16 24z' fill='none' stroke='%23b8a8ee' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M9 12.5h14M12.5 8 16 24l3.5-16' fill='none' stroke='%23b8a8ee' stroke-width='1.2' stroke-linejoin='round' opacity='.7'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://script.google.com" />
    <style>
      :root {
        --bg: #0e0d13;
        --ink: #f2effa;
        --line: rgba(242, 239, 250, 0.22);
        --glass: rgba(18, 15, 24, 0.8);
        --accent: #b8a8ee;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }

      [hidden] {
        display: none !important;
      }

      .frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      #hub {
        z-index: 1;
      }

      .app-frame {
        z-index: 2;
        background: var(--bg);
        animation: app-in 0.28s ease-out both;
      }

      @keyframes app-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Small pill in the bottom-left corner while an app is open: back to the list, or open in a new tab. */
      .bar {
        position: fixed;
        z-index: 3;
        left: calc(12px + env(safe-area-inset-left));
        bottom: calc(12px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        height: 36px;
        padding: 0 4px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--glass);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        color: var(--ink);
        font: 600 13px/1 -apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif;
        letter-spacing: 0.02em;
        opacity: 0.85;
        transition: opacity 0.2s ease-in-out;
        animation: app-in 0.28s ease-out 0.2s both;
      }

      .bar:hover,
      .bar:focus-within {
        opacity: 1;
      }

      .bar button,
      .bar a {
        all: unset;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border-radius: 14px;
        color: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .bar button:hover,
      .bar a:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .bar button:focus-visible,
      .bar a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .bar .sep {
        width: 1px;
        height: 16px;
        background: var(--line);
      }

      .bar svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @media (prefers-reduced-motion: reduce) {
        .app-frame,
        .bar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <iframe
      id="hub"
      class="frame"
      title="intelprint"
      src="https://script.google.com/macros/s/AKfycbwF95zPsAPKwgPGhu1Cirp8wb7sCPi5RLUPuv2IUBZFRdNLvwocFe0IAvF6M7eq0lri/exec?embed=1"
    ></iframe>

    <div id="bar" class="bar" hidden>
      <button type="button" id="back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>목록
      </button>
      <span class="sep" aria-hidden="true"></span>
      <a id="newTab" href="#" target="_blank" rel="noopener" title="새 탭에서 열기" aria-label="새 탭에서 열기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg>
      </a>
    </div>

    <script>
      (function () {
        'use strict';

        var hub = document.getElementById('hub');
        var bar = document.getElementById('bar');
        var back = document.getElementById('back');
        var newTab = document.getElementById('newTab');
        var appFrame = null;

        // Apps Script web app links only (the same rule the hub's sheet uses, narrowed to Apps Script).
        var APP_URL = /^https:\/\/script\.google\.com\/(?:a\/macros\/[\w.-]+|macros)\/s\/[\w-]+\/exec(?:\?[^#\s"'<>]*)?$/;
        var HUB_ORIGIN = /^https:\/\/[\w-]+\.googleusercontent\.com$/;

        // True when the message came from the hub frame or a frame inside it (Apps Script nests its own frames).
        function fromHub(source) {
          var w = source;
          for (var i = 0; w && i < 8; i += 1) {
            if (w === hub.contentWindow) return true;
            if (w === w.parent) return false;
            w = w.parent;
          }
          return false;
        }

        function openApp(url, name, push) {
          if (appFrame) return;
          appFrame = document.createElement('iframe');
          appFrame.className = 'frame app-frame';
          appFrame.title = name || '앱';
          appFrame.allow = 'clipboard-read; clipboard-write; microphone; camera; autoplay; fullscreen';
          appFrame.setAttribute('allowfullscreen', '');
          appFrame.src = url;
          document.body.appendChild(appFrame);
          newTab.href = url;
          bar.hidden = false;
          hub.style.visibility = 'hidden'; // lets the browser pause the hub's animated floor
          document.title = (name ? name + ' · ' : '') + 'intelprint';
          if (push) history.pushState({ intelprintApp: url, name: name }, '');
        }

        function closeApp() {
          if (!appFrame) return;
          appFrame.remove(); // a new frame per app keeps the app's own pages out of this page's history
          appFrame = null;
          bar.hidden = true;
          hub.style.visibility = '';
          document.title = 'intelprint';
        }

        window.addEventListener('message', function (event) {
          var data = event.data;
          if (!data || data.type !== 'intelprint:open' || typeof data.url !== 'string') return;
          if (!HUB_ORIGIN.test(event.origin) || !fromHub(event.source) || !APP_URL.test(data.url)) return;
          openApp(data.url, typeof data.name === 'string' ? data.name.slice(0, 60) : '', true);
        });

        back.addEventListener('click', function () {
          var pushed = history.state && history.state.intelprintApp;
          closeApp();
          if (pushed) history.back();
        });

        // Browser back (or a phone's back swipe) closes the app.
        window.addEventListener('popstate', function () {
          if (!(history.state && history.state.intelprintApp)) closeApp();
        });

        // After a reload with an app open, open it again.
        var state = history.state;
        if (state && typeof state.intelprintApp === 'string' && APP_URL.test(state.intelprintApp)) {
          openApp(state.intelprintApp, typeof state.name === 'string' ? state.name : '', false);
        }
      })();
    </script>
  </body>
</html>
