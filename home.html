/* Actions */

	ul.actions {
		display: -moz-flex;
		display: -webkit-flex;
		display: -ms-flex;
		display: flex;
		cursor: default;
		list-style: none;

		ul.actions li {

		}

		}

			ul.actions.special li:first-child {

			flex-direction: column;

			width: calc(100% + 1rem);
		}

			ul.actions.fit li {
				-moz-flex-grow: 1;
				-webkit-flex-grow: 1;
				-ms-flex-grow: 1;
				flex-grow: 1;
				-moz-flex-shrink: 1;

				-ms-flex-shrink: 1;

				ul.actions.fit li > * {

			}

		@media screen and (max-width: 480px) {

	.table-wrapper {

/* Header */

	#header {
		display: -moz-flex;
		display: -webkit-flex;
		display: -ms-flex;
		display: flex;
		-moz-flex-direction: column;
		-webkit-flex-direction: column;
		-ms-flex-direction: column;
		flex-direction: column;
		-moz-align-items: center;
		-webkit-align-items: center;
		-ms-align-items: center;
		align-items: center;
		-moz-transition: -moz-transform 0.325s ease-in-out, -moz-filter 0.325s ease-in-out, opacity 0.325s ease-in-out;
		-webkit-transition: -webkit-transform 0.325s ease-in-out, -webkit-filter 0.325s ease-in-out, opacity 0.325s ease-in-out;
		-ms-transition: -ms-transform 0.325s ease-in-out, -ms-filter 0.325s ease-in-out, opacity 0.325s ease-in-out;
		transition: transform 0.325s ease-in-out, filter 0.325s ease-in-out, opacity 0.325s ease-in-out;
		background-image: -moz-radial-gradient(rgba(0, 0, 0, 0.25) 25%, rgba(0, 0, 0, 0) 55%);
		background-image: -webkit-radial-gradient(rgba(0, 0, 0, 0.25) 25%, rgba(0, 0, 0, 0) 55%);
		background-image: -ms-radial-gradient(rgba(0, 0, 0, 0.25) 25%, rgba(0, 0, 0, 0) 55%);
		background-image: radial-gradient(rgba(0, 0, 0, 0.25) 25%, rgba(0, 0, 0, 0) 55%);
		max-width: 100%;
		text-align: center;
	}

		#header > * {
			-moz-transition: opacity 0.325s ease-in-out;
			-webkit-transition: opacity 0.325s ease-in-out;
			-ms-transition: opacity 0.325s ease-in-out;
			transition: opacity 0.325s ease-in-out;
			position: relative;
			margin-top: 3.5rem;
		}

			#header > *:before {
				content: '';
				display: block;
				position: absolute;
				top: calc(-3.5rem - 1px);
				left: calc(50% - 1px);
				width: 1px;
				height: calc(3.5rem + 1px);
				background: #ffffff;
			}

		#header > :first-child {
			margin-top: 0;
		}

			#header > :first-child:before {
				display: none;
			}

		#header .logo {
			width: 5.5rem;
			height: 5.5rem;
			line-height: 5.5rem;
			border: solid 1px #ffffff;
			border-radius: 100%;
		}

			#header .logo .icon:before {
				font-size: 2rem;
			}

		#header .content {
			border-style: solid;
			border-color: #ffffff;
			border-top-width: 1px;
			border-bottom-width: 1px;
			max-width: 100%;
		}

			#header .content .inner {
				-moz-transition: max-height 0.75s ease, padding 0.75s ease, opacity 0.325s ease-in-out;
				-webkit-transition: max-height 0.75s ease, padding 0.75s ease, opacity 0.325s ease-in-out;
				-ms-transition: max-height 0.75s ease, padding 0.75s ease, opacity 0.325s ease-in-out;
				transition: max-height 0.75s ease, padding 0.75s ease, opacity 0.325s ease-in-out;
				-moz-transition-delay: 0.25s;
				-webkit-transition-delay: 0.25s;
				-ms-transition-delay: 0.25s;
				transition-delay: 0.25s;
				padding: 3rem 2rem;
				max-height: 40rem;
				overflow: hidden;
			}

				#header .content .inner > :last-child {
					margin-bottom: 0;
				}

			#header .content p {
				text-transform: uppercase;
				letter-spacing: 0.2rem;
				font-size: 0.8rem;
				line-height: 2;
			}

		#header nav ul {
			display: -moz-flex;
			display: -webkit-flex;
			display: -ms-flex;
			display: flex;
			margin-bottom: 0;
			list-style: none;
			padding-left: 0;
			border: solid 1px #ffffff;
			border-radius: 4px;
		}

			#header nav ul li {
				padding-left: 0;
				border-left: solid 1px #ffffff;
			}

				#header nav ul li:first-child {
					border-left: 0;
				}

				#header nav ul li a {
					display: block;
					min-width: 7.5rem;
					height: 2.75rem;
					line-height: 2.75rem;
					padding: 0 1.25rem 0 1.45rem;
					text-transform: uppercase;
					letter-spacing: 0.2rem;
					font-size: 0.8rem;
					border-bottom: 0;
				}

					#header nav ul li a:hover {
						background-color: rgba(255, 255, 255, 0.075);
					}

					#header nav ul li a:active {
						background-color: rgba(255, 255, 255, 0.175);
					}

		#header nav.use-middle:after {
			content: '';
			display: block;
			position: absolute;
			top: 0;
			left: calc(50% - 1px);
			width: 1px;
			height: 100%;
			background: #ffffff;
		}

		#header nav.use-middle ul li.is-middle {
			border-left: 0;
		}

		body.is-article-visible #header {
			-moz-transform: scale(0.95);
			-webkit-transform: scale(0.95);
			-ms-transform: scale(0.95);
			transform: scale(0.95);
			-moz-filter: blur(0.1rem);
			-webkit-filter: blur(0.1rem);
			-ms-filter: blur(0.1rem);
			filter: blur(0.1rem);
			opacity: 0;
		}

		body.is-preload #header {
			-moz-filter: blur(0.125rem);
			-webkit-filter: blur(0.125rem);
			-ms-filter: blur(0.125rem);
			filter: blur(0.125rem);
		}

			body.is-preload #header > * {
				opacity: 0;
			}

			body.is-preload #header .content .inner {
				max-height: 0;
				padding-top: 0;
				padding-bottom: 0;
				opacity: 0;
			}

		@media screen and (max-width: 980px) {

			#header .content p br {
				display: none;
			}

		}

		@media screen and (max-width: 736px) {

			#header > * {
				margin-top: 2rem;
			}

				#header > *:before {
					top: calc(-2rem - 1px);
					height: calc(2rem + 1px);
				}

			#header .logo {
				width: 4.75rem;
				height: 4.75rem;
				line-height: 4.75rem;
			}

				#header .logo .icon:before {
					font-size: 1.75rem;
				}

			#header .content .inner {
				padding: 2.5rem 1rem;
			}

			#header .content p {
				line-height: 1.875;
			}

		}

		@media screen and (max-width: 480px) {

			#header {
				padding: 1.5rem 0;
			}

				#header .content .inner {
					padding: 2.5rem 0;
				}

				#header nav ul {
					-moz-flex-direction: column;
					-webkit-flex-direction: column;
					-ms-flex-direction: column;
					flex-direction: column;
					min-width: 10rem;
					max-width: 100%;
				}

					#header nav ul li {
						border-left: 0;
						border-top: solid 1px #ffffff;
					}

						#header nav ul li:first-child {
							border-top: 0;
						}

						#header nav ul li a {
							height: 3rem;
							line-height: 3rem;
							min-width: 0;
							width: 100%;
						}

				#header nav.use-middle:after {
					display: none;
				}

		}

(function () {
  'use strict';

  const MAX_RIPPLES = 8;
  const MESH = { low: 150, medium: 210, high: 280 };

  const MAX_RENDER_DIM = 2400;
  const INTRO_SECONDS = 3;
  const REVEAL_SECONDS = 2.6;
  const REVEAL_REACH = 19;
  const ORIGIN = [0, -3];
  const HOVER_EFFECTS = { press: 1, lift: -1, none: 0 };
  const LIGHTING = {
    split: [

      [-8, 3.6, 3, 4, 4]
    ],
    backlit: [
      [6, 1.6, -15, 5, 3],
      [-7, 1.4, -13, 5, 3]
    ],

  // intelprint: up to 6 x 6 app tiles.
  const MAX_APPS = 36;

  const FIELD = `
uniform vec4 uRipples[${MAX_RIPPLES}];
uniform vec4 uWave;
uniform float uSquare;
uniform float uClock;
uniform vec4 uSwell;
uniform vec4 uHover;
uniform vec4 uIntro;
// intelprint: calm zone (centre xy, radius, amount) - the swell is damped around the app block.
uniform vec4 uCalm;

float reachOf(vec2 delta, out vec2 grad) {
  vec2 a = abs(delta);
  vec2 dir = vec2(delta.x < 0.0 ? -1.0 : 1.0, delta.y < 0.0 ? -1.0 : 1.0);
  float round_ = length(delta);
  vec2 roundGrad = delta / max(round_, 1e-4);
  float m = max(max(a.x, a.y), 1e-4);
  vec2 k = a / m;
  vec2 k3 = k * k * k;
  float sum = dot(k3, k);
  float root = sqrt(sqrt(sum));
  float square = m * root;
  vec2 squareGrad = dir * k3 / (root * root * root);
  float d = mix(round_, square, uSquare);
  vec2 g = mix(roundGrad, squareGrad, uSquare);
  float soft = sqrt(d * d + 0.36);
  grad = g * d / soft;
  return soft - 0.6;
}

vec3 field(vec2 p) {
  float t = uSwell.w;
  float f = uSwell.y;
  vec2 k1 = vec2(0.19, 0.11) * f;
  vec2 k2 = vec2(-0.09, 0.23) * f;
  vec2 k3 = vec2(0.29, -0.17) * f;
  float a1 = dot(p, k1) + t * 0.55;
  float a2 = dot(p, k2) - t * 0.42 + 1.3;
  float a3 = dot(p, k3) + t * 0.74 + 2.1;
  float h = 0.55 * sin(a1) + 0.4 * sin(a2) + 0.22 * sin(a3);
  vec2 g = 0.55 * cos(a1) * k1 + 0.4 * cos(a2) * k2 + 0.22 * cos(a3) * k3;
  h *= uSwell.x;
  g *= uSwell.x;
  if (uCalm.w > 0.0) {
    vec2 cp = (p - uCalm.xy) / max(uCalm.z, 1e-3);
    float bell = uCalm.w * exp(-dot(cp, cp));
    g = g * (1.0 - bell) + h * bell * 2.0 * cp / max(uCalm.z, 1e-3);
    h *= 1.0 - bell;
  }
  vec2 dg;
  for (int i = 0; i < ${MAX_RIPPLES}; i++) {
    vec4 r = uRipples[i];
    if (r.w <= 0.0) continue;
    float age = uClock - r.z;
    if (age <= 0.0) continue;
    float d = reachOf(p - r.xy, dg);
    float radius = age * uWave.y;
    float x = (d - radius) / uWave.z;
    float life = clamp(1.0 - radius / uWave.w, 0.0, 1.0);
    float strength = r.w * uWave.x * life * life * smoothstep(0.0, 1.5, radius);
    float bump = exp(-x * x);
    h += bump * strength;
    g += -2.0 * x * bump * strength / uWave.z * dg;
  }
  if (uIntro.w > 0.0) {
    float d = reachOf(p - uIntro.xy, dg);
    float x = (d - uIntro.z) / 2.2;
    float bump = exp(-x * x) * uIntro.w;
    h += bump;
    g += -2.0 * x * bump / 2.2 * dg;
  }
  vec2 hd = p - uHover.xy;
  float hr = max(uHover.z, 1e-3);
  float hover = exp(-dot(hd, hd) / (hr * hr)) * uHover.w;
  h -= hover;
  g += 2.0 * hd / (hr * hr) * hover;
  return vec3(h, g);
}

  vec3 f = field(ground);
  vWorld = vec3(ground.x, f.x, ground.y);
  vGround = ground;
  gl_Position = uViewProj * vec4(vWorld, 1.0);
}`;

out vec4 outColor;

float smoother(float x) {
  x = clamp(x, 0.0, 1.0);
  return x * x * x * (x * (x * 6.0 - 15.0) + 10.0);
}

float hash(vec3 p) {
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}

void main() {
  vec3 f = field(vGround);
  vec3 n0 = normalize(vec3(-f.y, 1.0, -f.z));
  vec3 tx = normalize(vec3(1.0, f.y, 0.0));
  vec3 tz = normalize(cross(tx, n0));
  tx = normalize(cross(n0, tz));

  float c = cos(uAngle);
  float s = sin(uAngle);
  mat2 toTile = mat2(c, -s, s, c);
  vec2 q = toTile * (vGround - uGridShift) / uTile;
  vec2 cell = floor(q);
  vec2 local = q - cell - 0.5;
  float footprint = max(length(fwidth(q)), 1e-5);

  float on = 1.0;
  if (uReveal.w < 1.0) {
    vec2 centre = transpose(toTile) * (cell + 0.5) * uTile + uGridShift;
    vec2 dg;
    float d = reachOf(centre - uReveal.xy, dg);
    float delay = hash(vec3(cell, 7.0)) * 1.1;
    on = max(smoother((uReveal.z - d - delay) / 1.6), uReveal.w);
  }

  float half_ = (0.5 - uGap * 0.5) * mix(0.62, 1.0, on);
  float radius = min(uRound * half_, half_);
  vec2 dd = abs(local) - (half_ - radius);
  float d = length(max(dd, 0.0)) + min(max(dd.x, dd.y), 0.0) - radius;
  vec2 outward = dd.x > 0.0 || dd.y > 0.0 ? normalize(max(dd, 0.0) * sign(local)) : (dd.x > dd.y ? vec2(sign(local.x), 0.0) : vec2(0.0, sign(local.y)));

  float bevelWidth = max(mix(0.04, 0.42, uSoftness) * half_, footprint * 1.5);
  float edge = clamp((d + bevelWidth) / bevelWidth, 0.0, 1.0);
  float dome = uBulge * 0.5 * length(local) / max(half_, 1e-3);
  float theta = edge * edge * mix(0.7, 1.35, uSoftness) + dome;
  vec2 outwardGround = transpose(toTile) * outward;
  vec2 domeGround = transpose(toTile) * (local / max(length(local), 1e-4));
  vec3 bend = normalize(tx * mix(domeGround.x, outwardGround.x, edge) + tz * mix(domeGround.y, outwardGround.y, edge));
  float crowd = smoothstep(0.08, 0.3, footprint);
  theta *= 1.0 - crowd;
  vec3 n = normalize(n0 * cos(theta) + bend * sin(theta));

  float inside = 1.0 - smoothstep(-footprint * 0.75, footprint * 0.75, d);
  float area = (2.0 * half_) * (2.0 * half_) - (4.0 - 3.14159) * radius * radius;
  inside = mix(inside, area, crowd) * on;

  // intelprint: is this tile one of the app tiles?
  vec2 app = vec2(0.0);

    vec2 bc = cell - uBlock.xy;

      int idx = int(bc.y * uBlock.z + bc.x + 0.5);
      if (float(idx) < uBlock.w) app = uApp[idx];

  vec3 toEye = uEye - vWorld;
  float dist = length(toEye);
  vec3 v = toEye / dist;
  vec3 la = uLightA - vWorld;
  vec3 lb = uLightB - vWorld;
  float da = length(la);
  float db = length(lb);
  la /= da;
  lb /= db;
  float fa = 1.0 / (1.0 + da * da * 0.02);
  float fb = 1.0 / (1.0 + db * db * 0.02);

  vec3 ha = normalize(la + v);
  vec3 hb = normalize(lb + v);

  float sheenB = pow(max(dot(n, hb), 0.0), 8.0);

    vec3 body = mix(vec3(luma), uColor, 0.5) * 0.96;
    vec3 keyDir = normalize(vec3(-0.35, 0.85, 0.45));

    float wb = clamp(diffB * fb * 9.0, 0.0, 1.0);

    vec3 lit = body * mix(vec3(1.0), hue, clamp(wa + wb, 0.0, 1.0) * 0.42) * mix(0.7, 1.05, shade);
    lit += vec3(1.0) * (specA * fa + specB * fb) * 2.4 * uGloss;

    float core = 1.0 - smoothstep(0.0, 1.0, length(local) / max(half_, 1e-3));
    vec3 tint = mix(mix(uSecond, uAccent, clamp(0.5 - local.y, 0.0, 1.0)), vec3(1.0), 0.3);

    alpha = inside;

  float grain = hash(vec3(grainCell, uFrame)) + hash(vec3(grainCell + 17.0, uFrame + 3.0)) - 1.0;
  float lum = dot(color, vec3(0.299, 0.587, 0.114));
  color += grain * uGrain * (uLightMode > 0.5 ? 0.6 : 0.25 + 0.75 * sqrt(clamp(lum, 0.0, 1.0)));
  color = clamp(color, 0.0, 1.0);

  vec2 uv = gl_FragCoord.xy / uView;
  float edgeFade = max(uFade * 0.5, 1e-4);
  float mask = uFade > 0.0 ? smoother(uv.x / edgeFade) * smoother((1.0 - uv.x) / edgeFade) * smoother(uv.y / edgeFade) * smoother((1.0 - uv.y) / edgeFade) : 1.0;
  alpha *= mask;
  outColor = vec4(color * alpha, alpha);
}`;

  const UNIFORMS = [

    'uWave',
    'uSquare',
    'uClock',
    'uSwell',
    'uHover',
    'uIntro',
    'uViewProj',
    'uArea',
    'uEye',
    'uColor',
    'uAccent',
    'uSecond',

  const ease = x => {

  const glide = x => {
    const t = clamp(x, 0, 1);

  };

  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);

  };

  const compile = (gl, type, source) => {
    const shader = gl.createShader(type);
    if (!shader) return null;
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
    gl.deleteShader(shader);
    return null;
  };

  const link = (gl, vertexSource, fragmentSource) => {
    const vertex = compile(gl, gl.VERTEX_SHADER, vertexSource);
    const fragment = compile(gl, gl.FRAGMENT_SHADER, fragmentSource);
    const program = gl.createProgram();
    if (!vertex || !fragment || !program) return null;
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.linkProgram(program);
    gl.deleteShader(vertex);
    gl.deleteShader(fragment);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      gl.deleteProgram(program);

    zx /= len;
    zy /= len;
    zz /= len;
    let xx = zz;
    let xz = -zx;

    xz /= len;

      yx,
      zx,
      0,
      0,
      yy,
      zy,
      0,
      xz,
      yz,
      zz,
      0,

    const b09 = a[9] * a[14] - a[10] * a[13];
    const b10 = a[9] * a[15] - a[11] * a[13];
    const b11 = a[10] * a[15] - a[11] * a[14];

      (a[2] * b10 - a[1] * b11 - a[3] * b09) * k,
      (a[13] * b05 - a[14] * b04 + a[15] * b03) * k,
      (a[10] * b04 - a[9] * b05 - a[11] * b03) * k,
      (a[6] * b08 - a[4] * b11 - a[7] * b07) * k,
      (a[0] * b11 - a[2] * b08 + a[3] * b07) * k,
      (a[14] * b02 - a[12] * b05 - a[15] * b01) * k,
      (a[8] * b05 - a[10] * b02 + a[11] * b01) * k,
      (a[4] * b10 - a[5] * b08 + a[7] * b06) * k,
      (a[1] * b08 - a[0] * b10 - a[3] * b06) * k,
      (a[12] * b04 - a[13] * b02 + a[15] * b00) * k,
      (a[9] * b02 - a[8] * b04 - a[11] * b00) * k,
      (a[5] * b07 - a[4] * b09 - a[6] * b06) * k,
      (a[0] * b09 - a[1] * b07 + a[2] * b06) * k,
      (a[13] * b01 - a[12] * b03 - a[14] * b00) * k,

          const c = a + size + 1;

          indices[o + 1] = c;
          indices[o + 2] = b;
          indices[o + 3] = b;
          indices[o + 4] = c;
          indices[o + 5] = d;

      state.seed = (state.seed * 16807) % 2147483647;
      return (state.seed - 1) / 2147483646;
    };

    // intelprint: `still` ignores the small mouse "look" so the fit does not wobble; zoomFit shrinks the view to fit the block.
    const cameraFor = (s, still) => {
      const aspect = state.width / Math.max(state.height, 1);
      const distance = 8 / (s.zoom * state.zoomFit);
      const lx = still ? 0 : state.look.x;
      const ly = still ? 0 : state.look.y;
      const yaw = lx * 0.16;
      const pitch = 1.5 - s.tilt * 1.26 + ly * 0.05;
      const target = [ORIGIN[0], 0, ORIGIN[1]];
      const eye = [
        target[0] + Math.sin(yaw) * Math.cos(pitch) * distance,
        target[1] + Math.sin(pitch) * distance,
        target[2] + Math.cos(yaw) * Math.cos(pitch) * distance
      ];
      const projection = perspective(0.8, aspect, 0.1, 400);
      const view = lookAt(eye, target);
      const viewProj = multiply(projection, view);
      return { eye, target, viewProj, inverse: invert(viewProj), distance };
    };

    // intelprint: world point -> container pixels (x, y) and clip w.
    const projectWith = (camera, x, y, z) => {
      const m = camera.viewProj;
      const cx = m[0] * x + m[4] * y + m[8] * z + m[12];
      const cy = m[1] * x + m[5] * y + m[9] * z + m[13];
      const cw = m[3] * x + m[7] * y + m[11] * z + m[15];
      return [(cx / cw * 0.5 + 0.5) * state.width, (0.5 - cy / cw * 0.5) * state.height, cw];
    };

    // intelprint: zoom out (never in) until the app block fits inside settings.fit of the view.
    const fitBlock = () => {
      state.zoomFit = 1;
      const fit = settings.fit;
      if (!block.n || !fit || state.width < 2 || state.height < 2) return;
      const lo = block.i0;
      const hi = block.i0 + block.n;
      for (let pass = 0; pass < 4; pass += 1) {
        const camera = cameraFor(settings, true);
        let minX = Infinity;
        let maxX = -Infinity;
        let minY = Infinity;
        let maxY = -Infinity;
        for (const [qx, qy] of [[lo, lo], [hi, lo], [hi, hi], [lo, hi]]) {
          const g = toGround(qx, qy);
          const p = projectWith(camera, g[0], 0, g[1]);
          minX = Math.min(minX, p[0]);
          maxX = Math.max(maxX, p[0]);
          minY = Math.min(minY, p[1]);
          maxY = Math.max(maxY, p[1]);
        }
        const scale = Math.min((fit.w * state.width) / (maxX - minX), (fit.h * state.height) / (maxY - minY));
        state.zoomFit = clamp(state.zoomFit * scale, 0.3 / settings.zoom, 1);
      }
    };

    // intelprint: CPU copy of field() height so links can sit on the moving tiles.
    const reachOf = (dx, dz, square) => {
      const ax = Math.abs(dx);
      const az = Math.abs(dz);
      const round = Math.hypot(dx, dz);
      const m = Math.max(ax, az, 1e-4);
      const kx = ax / m;
      const kz = az / m;
      const root = Math.sqrt(Math.sqrt(kx * kx * kx * kx + kz * kz * kz * kz));
      const d = round + (m * root - round) * square;
      return Math.sqrt(d * d + 0.36) - 0.6;
    };
    const heightAt = (x, z) => {
      const u = state.field;
      if (!u) return 0;
      const f = u.swellFreq;
      const t = state.swell;
      const a1 = (x * 0.19 + z * 0.11) * f + t * 0.55;
      const a2 = (x * -0.09 + z * 0.23) * f - t * 0.42 + 1.3;
      const a3 = (x * 0.29 + z * -0.17) * f + t * 0.74 + 2.1;
      let h = (0.55 * Math.sin(a1) + 0.4 * Math.sin(a2) + 0.22 * Math.sin(a3)) * u.swellAmp;
      if (u.calm[3] > 0) {
        const cx = (x - u.calm[0]) / u.calm[2];
        const cz = (z - u.calm[1]) / u.calm[2];
        h *= 1 - u.calm[3] * Math.exp(-(cx * cx + cz * cz));
      }
      for (const ripple of state.ripples) {
        const age = state.clock - ripple.start;
        if (age <= 0) continue;
        const d = reachOf(x - ripple.x, z - ripple.z, u.square);
        const radius = age * u.waveSpeed;
        const k = (d - radius) / u.waveWidth;
        const life = clamp(1 - radius / u.waveReach, 0, 1);
        h += Math.exp(-k * k) * ripple.strength * u.waveAmp * life * life * smoothstep(0, 1.5, radius);
      }
      if (u.introW > 0) {
        const d = reachOf(x - ORIGIN[0], z - ORIGIN[1], u.square);
        const k = (d - u.introR) / 2.2;
        h += Math.exp(-k * k) * u.introW;
      }
      const hx = x - u.hover[0];
      const hz = z - u.hover[1];
      const hr = Math.max(u.hover[2], 1e-3);
      h -= Math.exp(-(hx * hx + hz * hz) / (hr * hr)) * u.hover[3];
      return h;
    };

    const rippleData = new Float32Array(MAX_RIPPLES * 4);

    const render = () => {
      const s = settings;
      buildMesh(s.mesh);
      resolveColors(s);
      const camera = cameraFor(s);
      state.camera = camera;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0, 0, 0, 0);
      gl.clearDepth(1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LEQUAL);
      gl.useProgram(surface.program);
      const u = surface.uniforms;
      rippleData.fill(0);
      state.ripples.forEach((ripple, index) => {
        rippleData[index * 4] = ripple.x;
        rippleData[index * 4 + 1] = ripple.z;
        rippleData[index * 4 + 2] = ripple.start;
        rippleData[index * 4 + 3] = ripple.strength;
      });
      const introAge = state.intro;
      const revealing = introAge < INTRO_SECONDS;
      const revealRadius = glide(introAge / REVEAL_SECONDS) * REVEAL_REACH;
      const settle = ease(introAge / INTRO_SECONDS);
      const field = {
        waveAmp: 0.55 * s.pulse,
        waveSpeed: 3 * Math.max(s.pulseSpeed, 0.05) + 1.2,
        waveWidth: 1.6 * s.pulseWidth,
        waveReach: 46,
        square: s.square,
        swellAmp: 1.3 * s.waves * (0.25 + 0.75 * settle),
        swellFreq: 1.9 / s.waveScale,
        hover: [state.hover.x, state.hover.z, (3 * s.mouseRadius) / 0.35, 0.7 * state.hover.presence * s.mouseStrength * s.hover],
        introR: revealRadius,
        introW: revealing ? 0.9 * (1 - smoothstep(0.55, 1, introAge / INTRO_SECONDS)) : 0,
        calm: block.count ? [ORIGIN[0], ORIGIN[1], block.n * tileUnit() * 0.85, 0.6] : [0, 0, 1, 0]
      };
      state.field = field;
      gl.uniform4fv(u.uRipples, rippleData);
      gl.uniform4f(u.uWave, field.waveAmp, field.waveSpeed, field.waveWidth, field.waveReach);
      gl.uniform1f(u.uSquare, s.square);
      gl.uniform1f(u.uClock, state.clock);
      gl.uniform4f(u.uSwell, field.swellAmp, field.swellFreq, 0, state.swell);
      gl.uniform4f(u.uHover, field.hover[0], field.hover[1], field.hover[2], field.hover[3]);
      gl.uniform4f(u.uIntro, ORIGIN[0], ORIGIN[1], revealRadius, field.introW);
      gl.uniform4f(u.uCalm, field.calm[0], field.calm[1], field.calm[2], field.calm[3]);
      gl.uniformMatrix4fv(u.uViewProj, false, camera.viewProj);
      gl.uniform4f(u.uArea, AREA[0] + ORIGIN[0], AREA[1] + ORIGIN[1], AREA[2], AREA[3]);
      gl.uniform3f(u.uEye, camera.eye[0], camera.eye[1], camera.eye[2]);
      gl.uniform3f(u.uColor, state.color[0], state.color[1], state.color[2]);
      gl.uniform3f(u.uAccent, state.accent[0], state.accent[1], state.accent[2]);
      gl.uniform3f(u.uSecond, state.second[0], state.second[1], state.second[2]);
      const orbit = state.lights;
      const reach = camera.distance / 8;
      const lightLevel = 0.35 + 0.65 * settle;
      const [first, second] = s.lights;
      gl.uniform3f(
        u.uLightA,
        camera.target[0] + (first[0] + Math.sin(orbit * 0.7) * first[3]) * reach,
        first[1] * reach * lightLevel + 0.6,
        camera.target[2] + (first[2] + Math.cos(orbit * 0.5) * first[4]) * reach
      );
      gl.uniform3f(
        u.uLightB,
        camera.target[0] + (second[0] + Math.cos(orbit * 0.6) * second[3]) * reach,
        second[1] * reach * lightLevel + 0.6,
        camera.target[2] + (second[2] + Math.sin(orbit * 0.45) * second[4]) * reach
      );
      gl.uniform1f(u.uTile, tileUnit());
      gl.uniform1f(u.uAngle, s.rotation);
      gl.uniform1f(u.uGap, s.gap);
      gl.uniform1f(u.uRound, s.roundness);
      gl.uniform1f(u.uSoftness, s.softness);
      gl.uniform1f(u.uBulge, s.bulge);
      gl.uniform1f(u.uGloss, s.gloss);
      const far = Math.min(s.depth * 3.2 * reach, AREA[3] * 0.62);
      gl.uniform2f(u.uRange, far * 0.5, far);
      gl.uniform1f(u.uBrightness, s.brightness);
      const pixelRatio = canvas.height / Math.max(state.height, 1);
      gl.uniform1f(u.uGrain, s.grain);
      gl.uniform1f(u.uGrainScale, Math.max(1, pixelRatio));
      gl.uniform1f(u.uLightMode, s.lightMode ? 1 : 0);
      gl.uniform1f(u.uOpacity, s.opacity);
      gl.uniform4f(u.uReveal, ORIGIN[0], ORIGIN[1], revealRadius, revealing ? 0 : 1);
      gl.uniform2f(u.uView, canvas.width, canvas.height);
      gl.uniform1f(u.uFade, s.fade);
      gl.uniform1f(u.uFrame, state.frame % 977);
      // intelprint
      gl.uniform2f(u.uGridShift, block.shift[0], block.shift[1]);
      gl.uniform4f(u.uBlock, block.i0, block.j0, block.n, block.count);
      for (let k = 0; k < MAX_APPS; k += 1) {
        appData[k * 2] = k < block.count ? apps.presence[k] : 0;
        appData[k * 2 + 1] = k < block.count ? apps.glow[k] : 0;
      }
      gl.uniform2fv(u.uApp, appData);
      let shown = 0;
      for (let k = 0; k < block.count; k += 1) shown = Math.max(shown, apps.presence[k]);
      gl.uniform2f(u.uFocus, apps.focus, shown);
      gl.bindVertexArray(vao);
      gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_INT, 0);
      gl.bindVertexArray(null);
      gl.disable(gl.DEPTH_TEST);
    };

    // intelprint: draw, then let the page move its links onto the tiles.
    const draw = () => {
      render();
      if (hooks.onFrame) hooks.onFrame(api);
    };

    const resize = () => {
      const s = settings;
      const width = Math.max(1, container.clientWidth);
      const height = Math.max(1, container.clientHeight);
      const baseDpr = Math.min(s.dpr || window.devicePixelRatio || 1, 2);
      const longest = Math.max(width, height) * baseDpr;
      const ratio = longest > MAX_RENDER_DIM ? (baseDpr * MAX_RENDER_DIM) / longest : baseDpr;
      const pixelWidth = Math.max(1, Math.round(width * ratio));
      const pixelHeight = Math.max(1, Math.round(height * ratio));
      if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
      }
      state.width = width;
      state.height = height;
      fitBlock();
      draw();
    };

    const groundPoint = (px, py) => {
      const camera = state.camera;
      if (!camera) return null;
      const nx = (px / state.width) * 2 - 1;
      const ny = 1 - (py / state.height) * 2;
      const m = camera.inverse;
      const fx = m[0] * nx + m[4] * ny + m[8] + m[12];
      const fy = m[1] * nx + m[5] * ny + m[9] + m[13];
      const fz = m[2] * nx + m[6] * ny + m[10] + m[14];
      const fw = m[3] * nx + m[7] * ny + m[11] + m[15];
      const dx = fx / fw - camera.eye[0];
      const dy = fy / fw - camera.eye[1];
      const dz = fz / fw - camera.eye[2];
      if (dy >= -1e-4) return null;
      const t = -camera.eye[1] / dy;
      return { x: camera.eye[0] + dx * t, z: camera.eye[2] + dz * t };
    };

    const spawn = (x, z, strength) => {
      state.ripples.push({ x, z, start: state.clock, strength });
      while (state.ripples.length > MAX_RIPPLES) state.ripples.shift();
    };

    // intelprint: app tiles rise in from the centre after the floor has opened; the chosen one lights up.
    const stepApps = dt => {
      if (!block.count) return false;
      const n = block.n;
      const mid = (n - 1) / 2;
      const since = state.clock - settings.appsStart;
      let busy = false;
      for (let k = 0; k < block.count; k += 1) {
        const away = Math.hypot((k % n) - mid, Math.floor(k / n) - mid);
        apps.presence[k] = reduce ? 1 : glide((since - away * 0.16) / 0.8);
        const want = k === apps.active ? 1 : 0;
        apps.glow[k] = reduce ? want : apps.glow[k] + (want - apps.glow[k]) * (1 - Math.exp(-dt / 0.16));
        if (Math.abs(want - apps.glow[k]) > 0.002) busy = true;
      }
      const wantFocus = apps.active >= 0 ? 1 : 0;
      apps.focus = reduce ? wantFocus : apps.focus + (wantFocus - apps.focus) * (1 - Math.exp(-dt / 0.3));
      return busy || Math.abs(wantFocus - apps.focus) > 0.002;
    };

    const frame = now => {
      raf = 0;
      if (!alive || !visible || document.hidden) return;
      const s = settings;
      const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60;
      last = now;
      const moving = !s.paused && !reduce;
      if (moving) {
        state.frame += 1;
        state.clock += dt;
        state.intro += dt;
        state.swell += dt * s.speed;
        state.lights += dt * s.speed * 0.6;
        const travel = 3 * Math.max(s.pulseSpeed, 0.05) + 1.2;
        const interval = (10 * s.pulseSpacing) / travel;
        if (s.pulse > 0 && state.clock >= state.nextRipple) {
          if (s.randomOrigin) {
            const spot = groundPoint((0.15 + random() * 0.7) * state.width, (0.25 + random() * 0.6) * state.height);
            if (spot) spawn(spot.x, spot.z, 1);
          } else {
            spawn(ORIGIN[0], ORIGIN[1], 1);
          }
          state.nextRipple = state.clock + interval * (s.randomOrigin ? 0.6 : 1);
        }
        const lifetime = 46 / travel + 1;
        state.ripples = state.ripples.filter(ripple => state.clock - ripple.start < lifetime);
      } else if (state.intro < INTRO_SECONDS) {
        state.intro = INTRO_SECONDS;
      }
      const appsBusy = stepApps(dt);

      const { pointer, hover, look } = state;
      const active = s.mouseInteraction && pointer.inside && !reduce;
      const spot = active && s.hover !== 0 ? groundPoint(pointer.x, pointer.y) : null;
      if (spot) {
        if (!hover.placed) {
          hover.x = spot.x;
          hover.z = spot.z;
          hover.vx = 0;
          hover.vz = 0;
          hover.placed = true;
        }
        hover.vx += (90 * (spot.x - hover.x) - 19 * hover.vx) * dt;
        hover.vz += (90 * (spot.z - hover.z) - 19 * hover.vz) * dt;
        hover.x += hover.vx * dt;
        hover.z += hover.vz * dt;
      }
      const goal = spot ? 1 : 0;
      hover.presence += (goal - hover.presence) * (1 - Math.exp(-dt / (goal > hover.presence ? 0.35 : 0.6)));
      if (!spot && hover.presence < 0.001) hover.placed = false;
      const lookX = active ? (pointer.x / state.width - 0.5) * 0.5 : 0;
      const lookY = active ? (0.5 - pointer.y / state.height) * 0.5 : 0;
      look.vx += (30 * (lookX - look.x) - 11 * look.vx) * dt;
      look.vy += (30 * (lookY - look.y) - 11 * look.vy) * dt;
      look.x += look.vx * dt;
      look.y += look.vy * dt;

      draw();
      const settling =
        appsBusy ||
        Math.abs(goal - hover.presence) > 0.002 ||
        Math.hypot(hover.vx, hover.vz) > 0.01 ||
        Math.abs(lookX - look.x) > 0.0002 ||
        Math.abs(lookY - look.y) > 0.0002;
      if (moving || settling) raf = requestAnimationFrame(frame);
      else last = 0;
    };

    const wake = () => {
      if (!raf && alive && visible && !document.hidden) raf = requestAnimationFrame(frame);
    };

    const onPointerMove = event => {
      const rect = container.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      state.pointer.x = x;
      state.pointer.y = y;
      state.pointer.inside = x >= 0 && y >= 0 && x <= rect.width && y <= rect.height;
      wake();
    };

    const onPointerDown = event => {
      const s = settings;
      if (!s.mouseInteraction || !s.pulseOnClick || event.button !== 0 || reduce) return;
      if (
        event.target instanceof Element &&
        event.target.closest('a, button, input, textarea, select, label, [role="button"]')
      )
        return;
      const rect = container.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;
      const spot = groundPoint(x, y);
      if (spot) spawn(spot.x, spot.z, 1.15);
      wake();
    };

    const onPointerLeave = () => {
      state.pointer.inside = false;
      wake();
    };

    const onVisibility = () => {
      last = 0;
      wake();
    };

    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(container);
    const intersection = new IntersectionObserver(entries => {
      visible = entries.some(entry => entry.isIntersecting);
      if (visible) {
        last = 0;
        wake();
      }
    });
    intersection.observe(container);
    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('pointerdown', onPointerDown);
    document.documentElement.addEventListener('pointerleave', onPointerLeave);
    document.addEventListener('visibilitychange', onVisibility);

    const redraw = () => {
      if (!raf) draw();
      wake();
    };

    const cellCentre = k => {
      const n = block.n;
      return toGround(block.i0 + (k % n) + 0.5, block.j0 + Math.floor(k / n) + 0.5);
    };

    // intelprint: what the page can ask for.
    const api = {
      reduced: reduce,
      // Replace some props (same names as the original component).
      set(next) {
        rawProps = Object.assign({}, rawProps, next);
        settings = normalize(rawProps);
        shapeBlock();
        fitBlock();
        redraw();
      },
      // How many app tiles to light up (block grows 3x3 -> 4x4 -> ... as needed).
      setApps(count) {
        block.count = clamp(Math.floor(count) || 0, 0, MAX_APPS);
        apps.presence.fill(0);
        apps.glow.fill(0);
        apps.active = -1;
        shapeBlock();
        fitBlock();
        redraw();
      },
      get blockSize() {
        return block.n;
      },
      get appCount() {
        return block.count;
      },
      setActive(k) {
        apps.active = k >= 0 && k < block.count ? k : -1;
        redraw();
      },
      // Four screen corners (container pixels, clockwise from top-left) of app tile k, following the moving surface.
      // `half` is half the tile width in tile units (0.5 = whole cell including the gap).
      tileQuad(k, half) {
        if (!state.camera || k < 0 || k >= block.count) return null;
        const n = block.n;
        const cx = block.i0 + (k % n) + 0.5;
        const cy = block.j0 + Math.floor(k / n) + 0.5;
        const h = half == null ? 0.5 - settings.gap * 0.5 : half;
        const out = [];
        for (const [dx, dy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
          const g = toGround(cx + dx * h, cy + dy * h);
          const p = projectWith(state.camera, g[0], heightAt(g[0], g[1]), g[1]);
          if (p[2] <= 0.01) return null;
          out.push([p[0], p[1]]);
        }
        return out;
      },
      tilePresence(k) {
        return k >= 0 && k < block.count ? apps.presence[k] : 0;
      },
      pulseTile(k, strength) {
        if (k < 0 || k >= block.count || reduce) return;
        const g = cellCentre(k);
        spawn(g[0], g[1], strength || 1.15);
        wake();
      },
      // Ripple from a point on screen (client pixels), for page elements that sit over the floor.
      pulseAt(clientX, clientY, strength) {
        if (reduce) return;
        const rect = container.getBoundingClientRect();
        const spot = groundPoint(clientX - rect.left, clientY - rect.top);
        if (spot) spawn(spot.x, spot.z, strength || 0.8);
        wake();
      },
      destroy() {
        alive = false;
        cancelAnimationFrame(raf);
        resizeObserver.disconnect();
        intersection.disconnect();
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerdown', onPointerDown);
        document.documentElement.removeEventListener('pointerleave', onPointerLeave);
        document.removeEventListener('visibilitychange', onVisibility);
        gl.deleteBuffer(gridBuffer);
        gl.deleteBuffer(indexBuffer);
        gl.deleteVertexArray(vao);
        gl.deleteProgram(surface.program);
        const lose = gl.getExtension('WEBGL_lose_context');
        if (lose) lose.loseContext();
        container.remove();
      }
    };

    shapeBlock();
    resize();
    wake();
    return api;
  }

  window.createAcidSquares = createAcidSquares;
})();
</script>

    var EMBED = DATA.embed === true;

    var FLOOR = {

    var floorHost = realm.querySelector('.realm-floor');
    var tilesLayer = realm.querySelector('.realm-tiles');
    var cardsLayer = realm.querySelector('.realm-cards');
    var titleEl = document.getElementById('realmTitle');
    var closeBtn = realm.querySelector('.realm-close');
    var emptyEl = realm.querySelector('p.realm-empty');
    var caption = realm.querySelector('.realm-caption');
    var captionName = caption.querySelector('strong');
    var captionDesc = caption.querySelector('.desc');
    var captionHint = caption.querySelector('.hint');
    var smallScreen = window.matchMedia && window.matchMedia('(hover: none), (max-width: 736px)').matches;
    var shareTools = document.getElementById('share-tools');
    var collectionTitle = document.getElementById('shared-collection');
    var workbenchTools = document.getElementById('workbench-tools');
    var topicFilter = document.getElementById('topic-filter');
    var editFavorites = document.getElementById('edit-favorites');
    var manageShared = document.getElementById('manage-shared');
    var unclassified = '\u0000';
    if (DATA.manageUrl) {
      manageShared.href = DATA.manageUrl;
      manageShared.hidden = false;
      manageShared.addEventListener('click', function () {
        window.dispatchEvent(new Event('intelprint:manage-shared'));
      });
    }
    var favoritesDialog = document.getElementById('favorites-dialog');
    var favoritesForm = document.getElementById('favorites-form');
    var favoritesList = document.getElementById('favorites-list');
    var favoritesError = document.getElementById('favorites-error');
    var favoritesKey = 'intelprint.favorites.v1';
    var favorites = new Set();
    try {
      var savedFavorites = JSON.parse(localStorage.getItem(favoritesKey));
      if (Array.isArray(savedFavorites)) favorites = new Set(savedFavorites);
    } catch (err) {}

    var view = { branch: null, mode: LOOK, floor: null, apps: [], links: [], selected: -1, closing: 0, lastPointer: 'mouse', lastPulse: 0 };

    // Focus from the keyboard (not from a tap, which also focuses links on some phones).
    function keyboardFocus(el) {
      try {
        return el.matches(':focus-visible');
      } catch (err) {
        return view.lastPointer === 'mouse';
      }
    }

    function findBranch(key) {
      for (var i = 0; i < DATA.branches.length; i += 1) if (DATA.branches[i].key === key) return DATA.branches[i];
      return null;
    }

    function favoriteCandidates() {
      var apps = new Map();
      DATA.branches.forEach(function (branch) {
        branch.apps.forEach(function (app) {
          if (app.id && !apps.has(app.id)) apps.set(app.id, app);
        });
      });
      return Array.from(apps.values());
    }

    function refreshBranch() {
      shareTools.hidden = view.branch.key !== 'study' || (DATA.staticHome && !window.catalogLoaded);
      workbenchTools.hidden = view.branch.key !== 'use';
      var apps = view.branch.apps;
      if (!shareTools.hidden) {
        collectionTitle.textContent = view.branch.collection || '연구회 모음';
        var currentTopic = topicFilter.value;
        var topics = view.branch.topics || Array.from(new Set(apps.flatMap(function (app) { return app.topics || []; })));
        topicFilter.replaceChildren(new Option('모든 분류', ''));
        topics.forEach(function (topic) { topicFilter.add(new Option(topic, topic)); });
        if (apps.some(function (app) { return !app.topics || !app.topics.length; })) {
          topicFilter.add(new Option('미분류', unclassified));
        }
        topicFilter.value = currentTopic;
        if (topicFilter.selectedIndex < 0) topicFilter.selectedIndex = 0;
        if (topicFilter.value === unclassified) {
          apps = apps.filter(function (app) { return !app.topics || !app.topics.length; });
        } else if (topicFilter.value) {
          apps = apps.filter(function (app) { return (app.topics || []).indexOf(topicFilter.value) >= 0; });
        }
      } else if (!workbenchTools.hidden) {
        var pinned = favoriteCandidates().filter(function (app) { return favorites.has(app.id); });
        apps = pinned.concat(apps.filter(function (app) { return !favorites.has(app.id); }));
      }
      view.apps = apps.slice(0, 36);
      if (body.classList.contains('is-realm')) renderApps();
    }

    topicFilter.addEventListener('change', refreshBranch);
    editFavorites.addEventListener('click', function () {
      favoritesError.hidden = true;
      favoritesList.replaceChildren();
      favoriteCandidates().forEach(function (app) {
        var label = document.createElement('label');
        var input = document.createElement('input');
        input.type = 'checkbox';
        input.name = 'favorite';
        input.value = app.id;
        input.checked = favorites.has(input.value);
        label.append(input, app.name);
        favoritesList.appendChild(label);
      });
      favoritesDialog.showModal();
    });
    favoritesForm.addEventListener('submit', function (event) {
      if (event.submitter && event.submitter.value === 'cancel') return;
      event.preventDefault();
      var selection = new FormData(favoritesForm).getAll('favorite');
      try { localStorage.setItem(favoritesKey, JSON.stringify(selection)); }
      catch (err) { favoritesError.hidden = false; return; }
      favorites = new Set(selection);
      favoritesDialog.close();
      refreshBranch();
    });

    // ---------- First screen (Dimension) ----------

    function renderNav() {
      nav.replaceChildren();
      nav.parentNode.classList.remove('use-middle');
      DATA.branches.forEach(function (branch) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#' + branch.key;
      a.textContent = branch.label;
      a.addEventListener('click', function (event) {
        event.preventDefault();
        openBranch(branch.key, true);
      });
      li.appendChild(a);
      nav.appendChild(li);
      });
    // Same as Dimension's main.js: with an even number of buttons the centre line needs a helper.
    var navItems = nav.children;
    if (navItems.length && navItems.length % 2 === 0) {
      nav.parentNode.classList.add('use-middle');
      navItems[navItems.length / 2].classList.add('is-middle');
    }
    }
    renderNav();

    // The static Pages home receives fresh data after its first paint.
    if (DATA.staticHome) {
      window.addEventListener('intelprint:catalog', function (event) {
        var branches = event.detail;
        var oldKeys = DATA.branches.map(function (b) { return b.key; }).join(',');
        DATA.branches = branches;
        if (oldKeys !== branches.map(function (b) { return b.key; }).join(',')) renderNav();
        if (view.branch && !view.closing) {
          var current = findBranch(view.branch.key);
          if (current) {
            view.branch = current;
            refreshBranch();
          }
        }
      });
    }

    // Play Dimension's opening animation once the page has loaded (with a fallback, in case "load" came early or never).
    var started = false;
    function start() {
      if (started) return;
      started = true;
      window.setTimeout(function () {
        body.classList.remove('is-preload');
        history_.initial(function (key) {
          if (key && findBranch(key)) openBranch(key, false);
        });
      }, 100);
    }
    start();

    // ---------- History (Apps Script runs the page in a frame, so use its history API there) ----------

    var history_ = (function () {
      var gs = window.google && window.google.script;
      if (gs && gs.history && gs.url) {
        var params = {};
        if (LOOK === 'c') params.look = 'c';
        if (EMBED) params.embed = '1';
        return {
          push: function (key) {
            gs.history.push({ b: key || '' }, params, key || '');
          },
          listen: function (fn) {
            gs.history.setChangeHandler(function (event) {
              fn((event && event.location && event.location.hash) || '');
            });
          },
          initial: function (fn) {
            gs.url.getLocation(function (location) {
              fn((location && location.hash) || '');
            });
          }
        };
      }
      return {
        push: function (key) {
          try {
            window.history.pushState({ b: key || '' }, '', key ? '#' + key : window.location.pathname + window.location.search);
          } catch (err) {}
        },
        listen: function (fn) {
          window.addEventListener('popstate', function () {
            fn(window.location.hash.replace(/^#/, ''));
          });
        },
        initial: function (fn) {
          fn(window.location.hash.replace(/^#/, ''));
        }
      };
    })();

    history_.listen(function (key) {
      if (key && findBranch(key)) {
        if (!view.branch) openBranch(key, false);
        else if (view.branch.key !== key) {
          closeBranch(false, function () {
            openBranch(key, false);
          });
        }
      } else if (view.branch) {
        closeBranch(false);
      }
    });

    // ---------- Branch view ----------

    function openBranch(key, push) {
      var branch = findBranch(key);
      if (!branch || view.branch) return;
      view.branch = branch;
      topicFilter.value = '';
      refreshBranch();
      if (push) history_.push(branch.key);
      titleEl.textContent = branch.label;
      setCaption(-1);
      body.classList.add('is-article-visible');
      wrapper.inert = true;
      window.setTimeout(function () {
        if (!view.branch || view.branch.key !== key) return;
        realm.setAttribute('aria-hidden', 'false');
        body.classList.add('is-realm');
        startFloor();
        closeBtn.focus({ preventScroll: true });
      }, 325);
    }

    function closeBranch(push, after) {
      if (!view.branch || view.closing) return;
      if (favoritesDialog.open) favoritesDialog.close();
      var key = view.branch.key;
      if (push) history_.push('');
      body.classList.remove('is-realm');
      realm.setAttribute('aria-hidden', 'true');
      view.closing = window.setTimeout(function () {
        view.closing = 0;
        stopFloor();
        view.branch = null;
        wrapper.inert = false;
        body.classList.remove('is-article-visible');
        var link = nav.querySelector('a[href="#' + key + '"]');
        if (link && !after) link.focus({ preventScroll: true });
        if (after) window.setTimeout(after, 360);
      }, 600);
    }

    function startFloor() {
      var props = {};
      for (var name in FLOOR) props[name] = FLOOR[name];
      props.fit = { w: 0.86, h: smallScreen ? 0.46 : 0.5 };
      if (smallScreen) {
        props.detail = 'low';
        props.dpr = 1.5;
      }
      var mode = LOOK;
      view.floor = window.createAcidSquares ? window.createAcidSquares(floorHost, props, { onFrame: mode === 'a' ? placeTiles : null }) : null;
      if (!view.floor) mode = 'c'; // no WebGL2: show the cards on the plain background
      view.mode = mode;
      renderApps();
    }

    function renderApps() {
      view.selected = -1;
      setCaption(-1);
      if (view.floor) view.floor.setActive(-1);
      emptyEl.hidden = view.apps.length > 0 || (DATA.staticHome && !window.catalogLoaded);
      emptyEl.textContent = topicFilter.value ? '이 분류에는 공유된 앱이 없어요' : '아직 비어 있어요';
      if (view.mode === 'a') {
        view.floor.setApps(view.apps.length);
        buildTiles();
      } else {
        buildCards();
      }
    }

    function stopFloor() {
      if (view.floor) view.floor.destroy();
      view.floor = null;
      view.links = [];
      view.selected = -1;
      tilesLayer.textContent = '';
      cardsLayer.textContent = '';
      setCaption(-1);
    }

    function setCaption(index) {
      var app = index >= 0 ? view.apps[index] : null;
      caption.classList.toggle('is-empty', !app);
      if (!app) return;
      captionName.textContent = app.name;
      captionDesc.textContent = app.desc || '';
      captionHint.textContent = view.mode === 'a' && (view.lastPointer === 'touch' || view.lastPointer === 'pen') ? '한 번 더 누르면 열려요' : '';
    }

    function select(index) {
      view.selected = index;
      if (view.floor && view.mode === 'a') view.floor.setActive(index);
      for (var i = 0; i < view.links.length; i += 1) view.links[i].classList.toggle('is-active', i === index);
      setCaption(index);
    }

    realm.addEventListener('pointerdown', function (event) {
      view.lastPointer = event.pointerType || 'mouse';
      // Tapping empty floor clears the choice.
      if (!(event.target instanceof Element) || !event.target.closest('a, button')) {
        if (view.lastPointer !== 'mouse') select(-1);
      }
    });

    closeBtn.addEventListener('click', function () {
      closeBranch(true);
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && view.branch && !favoritesDialog.open) closeBranch(true);
    });

    // Asks the intelprint.github.io page to open the app in place. The server marks which apps may (연구회 apps that
    // don't need Google sign-in); the rest open a new tab. Ctrl/Cmd/Shift-click still opens a new tab.
    function openInPlace(app, event) {
      if (!EMBED || app.inPlace !== true) return;
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.button) return;
      event.preventDefault();
      // The message holds only the public link the visitor just clicked, so it is fine for any page to see it.
      window.top.postMessage({ type: 'intelprint:open', url: app.url, name: app.name }, '*');
    }

    function appLink(app, className) {
      var a = document.createElement('a');
      a.className = className;
      a.href = app.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.setAttribute('aria-label', app.name + (app.desc ? ', ' + app.desc : ''));
      var glyph = document.createElement('span');
      glyph.className = 'glyph';
      glyph.setAttribute('aria-hidden', 'true');
      glyph.textContent = app.glyph;
      a.appendChild(glyph);
      return a;
    }

    // Look A: links stretched onto the floor tiles.
    function buildTiles() {
      tilesLayer.textContent = '';
      view.links = view.apps.map(function (app, index) {
        var a = appLink(app, 'tile-link');
        a.addEventListener('pointerenter', function (event) {
          if (event.pointerType === 'mouse') select(index);
        });
        a.addEventListener('pointerleave', function (event) {
          if (event.pointerType === 'mouse' && view.selected === index) select(-1);
        });
        a.addEventListener('focus', function () {
          if (keyboardFocus(a)) select(index);
        });
        a.addEventListener('blur', function () {
          if (view.selected === index) select(-1);
        });
        a.addEventListener('click', function (event) {
          var touch = view.lastPointer === 'touch' || view.lastPointer === 'pen';
          if (touch && view.selected !== index) {
            // First tap shows the name; the second tap opens the app.
            event.preventDefault();
            select(index);
            view.floor.pulseTile(index, 1);
            return;
          }
          view.floor.pulseTile(index, 1.3);
          openInPlace(app, event);
        });
        tilesLayer.appendChild(a);
        return a;
      });
    }

    // Called by the floor after every frame.
    function placeTiles(floor) {
      for (var i = 0; i < view.links.length; i += 1) {
        var el = view.links[i];
        var quad = floor.tileQuad(i, 0.5);
        var presence = floor.tilePresence(i);
        if (!quad || presence <= 0.001) {
          el.style.visibility = 'hidden';
          continue;
        }
        el.style.visibility = '';
        el.style.opacity = presence.toFixed(3);
        el.style.transform = squareTo(quad, 100);
      }
    }

    // CSS matrix3d that maps a size x size square onto the four corners (top-left, top-right, bottom-right, bottom-left).
    function squareTo(q, size) {
      var x0 = q[0][0], y0 = q[0][1], x1 = q[1][0], y1 = q[1][1], x2 = q[2][0], y2 = q[2][1], x3 = q[3][0], y3 = q[3][1];
      var dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3;
      var dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
      var den = dx1 * dy2 - dx2 * dy1;
      var g = den ? (dx3 * dy2 - dx2 * dy3) / den : 0;
      var h = den ? (dx1 * dy3 - dx3 * dy1) / den : 0;
      var a = x1 - x0 + g * x1, b = x3 - x0 + h * x3, c = x0;
      var d = y1 - y0 + g * y1, e = y3 - y0 + h * y3, f = y0;
      var s = 1 / size;
      return 'matrix3d(' + [a * s, d * s, 0, g * s, b * s, e * s, 0, h * s, 0, 0, 1, 0, c, f, 0, 1].map(function (n) {
        return +n.toFixed(6);
      }).join(',') + ')';
    }

    // Look C: glass cards in a grid; the floor ripples under the card you point at.
    function buildCards() {
      cardsLayer.textContent = '';
      if (!view.apps.length) return;
      var n = Math.max(3, Math.ceil(Math.sqrt(view.apps.length)));
      if (smallScreen) n = Math.min(n, 3);
      var rows = Math.ceil(view.apps.length / n);
      var grid = document.createElement('div');
      grid.className = 'card-grid';
      grid.style.setProperty('--n', n);
      grid.style.setProperty('--rows', rows);
      var mid = (n - 1) / 2;
      view.links = view.apps.map(function (app, index) {
        var a = appLink(app, 'card-link');
        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = app.name;
        a.appendChild(name);
        var away = Math.hypot((index % n) - mid, Math.floor(index / n) - (rows - 1) / 2);
        a.style.setProperty('--delay', (view.floor ? 1 : 0.2) + away * 0.12 + 's');
        a.addEventListener('pointerenter', function (event) {
          if (event.pointerType === 'mouse') {
            select(index);
            ripple(a, 0.7);
          }
        });
        a.addEventListener('pointerleave', function (event) {
          if (event.pointerType === 'mouse' && view.selected === index) select(-1);
        });
        a.addEventListener('focus', function () {
          if (keyboardFocus(a)) select(index);
        });
        a.addEventListener('blur', function () {
          if (view.selected === index) select(-1);
        });
        a.addEventListener('click', function (event) {
          ripple(a, 1.2, true);
          openInPlace(app, event);
        });
        grid.appendChild(a);
        return a;
      });
      cardsLayer.appendChild(grid);
    }

    function ripple(el, strength, force) {
      if (!view.floor) return;
      var now = Date.now();
      if (!force && now - view.lastPulse < 350) return;
      view.lastPulse = now;
      var r = el.getBoundingClientRect();
      view.floor.pulseAt(r.left + r.width / 2, r.top + r.height / 2, strength);
    }
  })();
</script>
